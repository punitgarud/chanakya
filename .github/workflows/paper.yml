name: MAHADEV v27 Paper 12Hrs
on:
  push:
    branches: [main]
  schedule:
    - cron: '*/2 * * * *'
  workflow_dispatch:
jobs:
  paper:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: |
          FILE=$(find . -name "paper_v27_clean.js" | head -1)
          DIR=$(dirname $FILE)
          cd $DIR
          node paper_v27_clean.js
          cd $GITHUB_WORKSPACE
          git config user.name "mahadev-bot"
          git config user.email "bot@mahadev.com"
          git add docs/status.json docs/paper_log.txt || true
          git commit -m "paper: update dashboard $(date -u)" || true
          git push origin main || true
