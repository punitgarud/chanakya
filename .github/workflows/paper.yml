name: MAHADEV v27 Paper 12Hrs
on:
  push:
    branches: [main]
  schedule:
    - cron: '*/1 * * * *'
  workflow_dispatch:
jobs:
  paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: |
          cd chanakya
          npm install --legacy-peer-deps --no-audit
          node paper_v27_clean.js || echo "paper cycle ok"
