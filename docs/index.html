<!doctype html><html><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>MAHADEV v28 PAPER 12H</title><style>body{background:#050505;color:#00ff88;font-family:monospace;padding:14px}h1{color:#00ff88;text-shadow:0 0 10px #00ff88}.card{border:1px solid #00ff88;background:#111;border-radius:14px;padding:14px;margin:12px 0}.best{border-color:gold;color:#ffd700}.btn{background:#00ff88;color:#000;border:0;padding:10px 18px;border-radius:10px;font-weight:bold;cursor:pointer}</style></head><body><h1>🔱 MAHADEV v28 PAPER 12H ZERO-KEY</h1><div class="card">DexScreener + RugCheck FREE - no keys<br><span id="timer"></span><br><br><button class="btn" onclick="runOnce()">Run Scan Now</button> <button class="btn" onclick="clearLogs()">Clear</button></div><div id="lead" class="card best"></div><div id="trades" class="card"></div><script>
const MODS=[["MICKY","0.04 SOL"],["SNIPER","0.3 SOL"],["SCALPERG","0.2 SOL"],["DEGEN","0.5+0.1 SOL"],["VULTURE","0.25 SOL"],["AIRDROP","0.05 SOL"],["SCALPER","DLMM"],["MOMENTUM","DLMM"],["MEANREV","DLMM"],["BREAKOUT","DLMM"],["GRID","DLMM"]];
let trades=JSON.parse(localStorage.getItem("paper_trades")||"[]");let start=parseInt(localStorage.getItem("paper_start")||Date.now());if(!localStorage.getItem("paper_start")) localStorage.setItem("paper_start",start);
async function dex(q){try{let r=await fetch(`https://api.dexscreener.com/latest/dex/search/?q=${q}`);let j=await r.json();return j.pairs||[];}catch(e){return[];}}
async function rug(m){try{let r=await fetch(`https://api.rugcheck.xyz/v1/tokens/${m}/report`);if(r.status!=200) return {ok:true};let j=await r.json();let rs=j.risks||[];return {ok:j.score<500&&!rs.some(x=>x.name=="mint_authority")&&!rs.some(x=>x.name=="freeze_authority")};}catch(e){return {ok:true};}}
function toT(p){let tx=(p.txns&&p.txns.m5)||{};let b=tx.buys||0,s=tx.sells||0;let inflow=b/(b+s)||0.5;let age=(Date.now()-(p.pairCreatedAt||Date.now()))/3600000;return {mint:p.baseToken.address,symbol:p.baseToken.symbol,mcap:p.fdv||p.marketCap||0,liq:(p.liquidity&&p.liquidity.usd||0)/1000,inflow,age_h:age};}
async function runOnce(){let qmap={MICKY:"pump",SNIPER:"SOL",SCALPERG:"SOL",DEGEN:"pump.fun",VULTURE:"SOL",AIRDROP:"SOL",SCALPER:"SOL",MOMENTUM:"SOL",MEANREV:"SOL",BREAKOUT:"SOL",GRID:"SOL"};for(let [mod,size] of MODS){let pairs=await dex(qmap[mod]||"SOL");let toks=pairs.map(toT).filter(t=>t.liq>=5&&t.mcap>=20000).slice(0,12);for(let t of toks){if(mod=="MICKY"&&!(t.mcap>=30000&&t.mcap<=350000&&t.inflow>=0.6)) continue;if(mod=="SNIPER"&&!(t.mcap>=50000&&t.mcap<=500000&&t.inflow>=0.6)) continue;if(mod=="DEGEN"&&!(t.mcap<100000&&t.age_h<24)) continue;let rc=await rug(t.mint);if(!rc.ok) continue;trades.push({ts:Date.now(),module:mod,symbol:t.symbol,mcap:Math.floor(t.mcap),inflow:t.inflow.toFixed(2),size});if(trades.length>500) trades=trades.slice(-500);}}localStorage.setItem("paper_trades",JSON.stringify(trades));render();}
function render(){let by={};trades.forEach(t=>by[t.module]=(by[t.module]||0)+1);let lead=Object.entries(by).sort((a,b)=>b[1]-a[1]);let elapsed=((Date.now()-start)/3600000).toFixed(2);let remain=Math.max(0,12-elapsed).toFixed(2);document.getElementById("timer").innerHTML=`Elapsed ${elapsed}h /12h - Remain ${remain}h - Total ${trades.length} PAPER`;document.getElementById("lead").innerHTML=`<b>🏆 LEADERBOARD - best gets most capital</b><br>`+lead.map((x,i)=>`${i+1}. ${x[0]}: ${x[1]} ${i==0?'🔥40%':i==1?'🔥30%':i==2?'🔥20%':''}`).join("<br>")+(lead.length?`<br><br>After 12H: ${lead[0]?.[0]} 40%, ${lead[1]?.[0]} 30%, ${lead[2]?.[0]} 20%`:"Click Run Scan");let last=[...trades].reverse().slice(0,25);document.getElementById("trades").innerHTML=`<b>Last 25 PAPER (real Dex data)</b><br>`+last.map(x=>`${new Date(x.ts).toLocaleTimeString()} ${x.module} ${x.symbol} ${x.mcap} inflow=${x.inflow} ${x.size}`).join("<br>");}
function clearLogs(){if(confirm("Clear?")){trades=[];localStorage.removeItem("paper_trades");localStorage.setItem("paper_start",Date.now());render();}}
render();setInterval(runOnce,120000);runOnce();
</script></body></html>
