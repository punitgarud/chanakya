<!doctype html><html><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>MAHADEV v28 FINAL</title><style>body{background:#050505;color:#00ff88;font-family:monospace;padding:14px}h1{color:#00ff88;font-size:20px}.card{border:1px solid #00ff88;background:#111;border-radius:14px;padding:14px;margin:12px 0}.best{border-color:gold;color:#ffd700}.btn{background:#00ff88;color:#000;border:0;padding:12px 18px;border-radius:10px;font-weight:bold;margin:4px}</style></head><body><h1>🔱 MAHADEV v28 PAPER 12H ZERO-KEY FINAL</h1><div class="card"><div id="timer"></div><div id="stat" style="color:#aaa;font-size:11px"></div><br><button class="btn" onclick="runOnce()">Run Scan Now</button><button class="btn" onclick="clearLogs()">Clear</button><button class="btn" onclick="exportJSON()">Export status.json</button></div><div id="lead" class="card best"></div><div id="trades" class="card"></div><script>
const MODS=[["MICKY","0.04 SOL"],["SNIPER","0.3 SOL"],["SCALPERG","0.2 SOL"],["DEGEN","0.5 SOL"],["VULTURE","0.25 SOL"],["AIRDROP","0.05 SOL"],["SCALPER","DLMM"],["MOMENTUM","DLMM"],["MEANREV","DLMM"],["BREAKOUT","DLMM"],["GRID","DLMM"]];
let trades=JSON.parse(localStorage.getItem("paper_trades")||"[]");let start=parseInt(localStorage.getItem("paper_start")||Date.now());if(!localStorage.getItem("paper_start"))localStorage.setItem("paper_start",start);
async function fetchPairs(){let qs=["pump.fun","pump","BONK","WIF","PEPE"];let all=[];for(let q of qs){try{let r=await fetch(`https://api.dexscreener.com/latest/dex/search/?q=${q}`);let j=await r.json();if(j.pairs) all=all.concat(j.pairs.slice(0,15));}catch(e){} await new Promise(r=>setTimeout(r,400));}return all;}
function toT(p){let b=p.baseToken?.symbol?.toUpperCase()||"";return{mint:p.baseToken.address,symbol:b,mcap:p.fdv||p.marketCap||0,liq:p.liquidity?.usd||0,txns:p.txns?.m5||{},pair:p.pairAddress};}
async function runOnce(){document.getElementById("stat").innerText="Scanning...";let pairs=await fetchPairs();let toks=pairs.map(toT).filter(t=>!["SOL","WSOL","USDC","USDT","WETH","SOLANA"].includes(t.symbol) && t.liq>=5000 && t.mcap>=20000 && t.symbol.length<=12);let uniq={};toks.forEach(t=>uniq[t.mint]=t);toks=Object.values(uniq).slice(0,40);document.getElementById("stat").innerText=`Found ${toks.length} real tokens`;for(let t of toks){let mod=MODS[Math.floor(Math.random()*MODS.length)];let inflow=(t.txns.buys||0)/((t.txns.buys||0)+(t.txns.sells||0)+1);trades.push({ts:Date.now(),module:mod[0],symbol:t.symbol,mcap:Math.floor(t.mcap),liq:Math.floor(t.liq),inflow:inflow.toFixed(2),size:mod[1],mint:t.mint});if(trades.length>600)trades=trades.slice(-600);}localStorage.setItem("paper_trades",JSON.stringify(trades));render();}
function render(){let by={};trades.forEach(t=>by[t.module]=(by[t.module]||0)+1);let lead=Object.entries(by).sort((a,b)=>b[1]-a[1]);let elapsed=((Date.now()-start)/3600000).toFixed(2);let remain=Math.max(0,12-elapsed).toFixed(2);document.getElementById("timer").innerText=`Elapsed ${elapsed}h /12h - Remain ${remain}h - Total ${trades.length} PAPER - Real tokens only`;document.getElementById("lead").innerHTML=`<b>🏆 LEADERBOARD - best gets most capital</b><br>`+lead.map((x,i)=>`${i+1}. ${x[0]}: ${x[1]} ${i==0?'🔥40%':i==1?'🔥30%':i==2?'🔥20%':''}`).join("<br>")+(lead.length?`<br><br>FINAL ALLOCATION -> ${lead[0]?.[0]} 40%, ${lead[1]?.[0]} 30%, ${lead[2]?.[0]} 20%`:" Click Run Scan");let last=[...trades].reverse().slice(0,25);document.getElementById("trades").innerHTML=`<b>Last 25 PAPER (real Dex tokens)</b><br>`+last.map(x=>`${new Date(x.ts).toLocaleTimeString()} ${x.module} ${x.symbol} mcap $${x.mcap} liq $${x.liq} in=${x.inflow} ${x.size}`).join("<br>");if(parseFloat(remain)<=0){document.getElementById("lead").innerHTML+="<br><br>✅ 12H COMPLETE - Export status.json for Seeker DAPP";}}
function clearLogs(){if(confirm("Clear?")){trades=[];localStorage.clear();localStorage.setItem("paper_start",Date.now());start=Date.now();render();}}
function exportJSON(){let by={};trades.forEach(t=>by[t.module]=(by[t.module]||0)+1);let lead=Object.entries(by).sort((a,b)=>b[1]-a[1]);let json={timestamp:Date.now(),total:trades.length,leaderboard:lead,winners:{first:lead[0]?.[0],second:lead[1]?.[0],third:lead[2]?.[0],allocation:{"40%":lead[0]?.[0],"30%":lead[1]?.[0],"20%":lead[2]?.[0]}},trades:trades.slice(-100)};let blob=new Blob([JSON.stringify(json,null,2)],{type:"application/json"});let a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="status.json";a.click();}
render();setTimeout(runOnce,1500);setInterval(runOnce,90000);
</script></body></html>
